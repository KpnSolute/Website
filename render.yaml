services:
  - type: web
    name: kpnsolute-api
    runtime: node
    buildCommand: npm ci --include=dev --ignore-scripts && npx esbuild apps/api/src/index.ts --bundle --platform=node --format=esm --target=node20 --packages=external --alias:@kpn/contracts=./packages/contracts/src/index.ts --alias:@kpn/config=./packages/config/src/index.ts --outfile=apps/api/dist/index.js
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: SUPABASE_URL, value: https://vwbrxcltetelvvkbnbru.supabase.co }
      - { key: SUPABASE_PUBLISHABLE_KEY, sync: false }
      - { key: SUPABASE_JWT_AUDIENCE, value: authenticated }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: BILLING_APP_ORIGIN, value: https://billing.kpnsolute.com }
  - type: web
    name: kpnsolute-hub
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build --workspace apps/hub
    staticPublishPath: apps/hub/dist
    routes: [{ type: rewrite, source: /*, destination: /index.html }]
    envVars: &frontend-env
      - { key: VITE_API_BASE_URL, value: https://api.kpnsolute.com }
      - { key: VITE_KPNAUTH_URL, value: https://vwbrxcltetelvvkbnbru.supabase.co }
      - { key: VITE_SUPABASE_URL, value: https://vwbrxcltetelvvkbnbru.supabase.co }
      - { key: VITE_SUPABASE_PUBLISHABLE_KEY, sync: false }

  - type: web
    name: kpnsolute-accounts
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build --workspace apps/accounts
    staticPublishPath: apps/accounts/dist
    routes: [{ type: rewrite, source: /*, destination: /index.html }]
    envVars: *frontend-env

  - type: web
